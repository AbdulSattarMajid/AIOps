# Alembic configuration file for AIOps PostgreSQL migrations.
# DATABASE_URL is read from the environment (set by dotenv) in env.py.
# This file contains NO database URL or password.

[alembic]
# Path to migration scripts
script_location = migrations

# Template for new migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for the generated timestamps
timezone = UTC

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
